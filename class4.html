<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </head>
  <body style="text-align:center;">
    <div class="jumbotron">
        <h1>
            Jumbotron
        </h1>

    </div>
    <div class="container">
        <h2>Buttons</h2>

        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-danger">Danger</button>










        <h2>Contexual Badges</h2>
        <button type="button" class="btn btn-success">Messages <span class="badge badge-primary">4</span></button>
        <button type="button" class="btn btn-danger">Calls <span class="badge badge-secondary">5</span></button>
        <span class="badge badge-success">Success</span>
        <span class="badge badge-danger">Danger</span>
        <span class="badge badge-warning">Warning</span>
        <span class="badge badge-info">Info</span>
        <span class="badge badge-light">Light</span>
        <span class="badge badge-dark">Dark</span>




        <h2>Progress bar</h2>
        <p>
            To create a default progress bar, add a .progress class to a container element 
            and add the progress-bar class to its child element. Use CSS width property to 
            set the width of the progress bar:
        </p>
        <div class="progress">
            <div class="progress-bar" style="width: 30%">
                30%
            </div>
        </div>
    </div>
  </body>
</html>
