<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
        .col {
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <h3>
        Resize the browser window to see the effect
    </h3>
    <div class="container">
        <div class="row">
            <div class="col-md-8 col-xs-4" style="background-color: red; border: 2px solid black;">
                Extra small
            </div>

            <div class="col-md-12 col-md-5" style="background-color: yellowgreen; border: 2px solid black;">
                .col-xs-3
            </div>

        </div>


           <div class="row">
            <div class="col-md-12 col-lg-6" style="background-color: rgb(0, 81, 255); border: 2px solid black;">
                Large
            </div>

            <div class="col-md-6 col-md-2" style="background-color: rgb(138, 0, 252); border: 2px solid black;">
                .col-xs-6
            </div>
            
        </div>
    </div>
</body>

</html>
